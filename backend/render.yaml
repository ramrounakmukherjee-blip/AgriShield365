# Render free-tier deploy config (https://render.com) — no credit card needed.
# 1. New -> Web Service -> connect the GitHub repo.
# 2. Root Directory: backend   (Render reads this file automatically).
# 3. Add an environment variable:
#      FIREBASE_CREDENTIALS = <paste the full Firebase service-account JSON>
#    (Add later — the app runs fine without it, just won't persist to Firestore.)
services:
  - type: web
    name: agrishield365-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
